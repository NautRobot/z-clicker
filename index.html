<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeke Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<!-- REAL FIREBASE TRACKING MODULE -->
<script type="module">
  // Import Firebase components via CDN
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
  import { getDatabase, ref, onValue, onDisconnect, set, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCyD2K3TT7hOfakFPgJ9mMjTEM8Jim9_rA",
    authDomain: "z-clicker-97488.firebaseapp.com",
    projectId: "z-clicker-97488",
    storageBucket: "z-clicker-97488.firebasestorage.app",
    messagingSenderId: "686862323992",
    appId: "1:686862323992:web:e25c46b7deb67254278e6d",
    measurementId: "G-Y92C3EM9E1",
    // Added your default database URL to ensure connection works
    databaseURL: "https://z-clicker-97488-default-rtdb.firebaseio.com" 
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getDatabase(app);

  // 1. LIVE USER TRACKING
  // Generate a random unique ID for this browser tab
  const sessionId = Date.now() + Math.random().toString(36).substring(2);
  const sessionRef = ref(db, 'online_users/' + sessionId);

  // Add this user to database, and auto-delete them when they close the tab
  set(sessionRef, true);
  onDisconnect(sessionRef).remove();

  // Listen for the total number of online users
  const usersRef = ref(db, 'online_users');
  onValue(usersRef, (snapshot) => {
      let count = snapshot.size || 0;
      document.getElementById('realLiveUsers').innerText = count;
  });

  // 2. TOTAL VISITS TRACKING
  const visitsRef = ref(db, 'total_visits');
  set(visitsRef, increment(1)); // Add +1 to total visits every time page loads
  
  onValue(visitsRef, (snapshot) => {
      let total = snapshot.val() || 0;
      document.getElementById('realTotalVisits').innerText = total.toLocaleString();
  });
</script>

<header class="banner">
  <h1>ZEKE CLICKER</h1>
  <div class="live-stats">
    <div><span class="pulse-dot"></span>Online Now: <span id="realLiveUsers" class="stat-number">Loading...</span></div>
    <div style="margin-top: 5px;">👁️ Total Visits: <span id="realTotalVisits" class="stat-number">Loading...</span></div>
  </div>
</header>

<!-- Global Tooltip for Upgrades -->
<div id="tooltip" class="tooltip" style="display:none;"></div>

<div class="main-layout">
  
  <!-- LEFT PANEL: The Clicker & Stats -->
  <div class="panel left-panel">
    <div class="score-board">
        <p class="score-main">Zekes: <br><span id="zekeCount" style="color:#00ffff; font-size:2.5rem;">0</span></p>
        <p style="color: #ccc; margin: 10px 0; font-size: 1.1rem;">per second: <span id="cpsDisplay" style="color:#fff;">0</span></p>
    </div>

    <div class="zeke-container">
      <img src="zeke.jpg" id="zeke" alt="Zeke">
    </div>
    
    <div class="stats-box">
      <p>Click Value: <span id="clickValueDisplay">1</span></p>
      <p id="critDisplay" style="display:none; color:#ff00ff; margin-top:5px; font-weight:bold;">✨ Crit Chance: 10% (x5 Damage)</p>
    </div>
  </div>

  <!-- MIDDLE PANEL: Prestige & Skill Trees -->
  <div class="panel middle-panel">
    
    <!-- Rebirth Section -->
    <div class="prestige-section rebirth-section">
      <h3>REBIRTH</h3>
      <p>Soft reset for Memory Fragments.</p>
      <p class="prestige-currency">Memories: <span id="memoryCount">0</span></p>
      <p style="font-size: 0.85rem; color: #aaa;">(+<span id="memoryBoost">0</span>% global production)</p>
      
      <button id="btn-rebirth" class="btn-prestige" onclick="triggerRebirth()">
        Rebirth (+<span id="pendingMemories">0</span>)
      </button>

      <div class="tree-container" id="rebirth-tree">
        <!-- Rebirth upgrades inject here via JS -->
      </div>
    </div>

    <hr style="border-color: #333; margin: 20px 0;">

    <!-- Ascension Section -->
    <div class="prestige-section ascension-section">
      <h3 style="color: #ffd700;">ASCENSION</h3>
      <p>Hard reset for Astral Zekes.</p>
      <p class="prestige-currency" style="color: #ffd700;">Astral Zekes: <span id="astralCount">0</span></p>
      
      <button id="btn-ascend" class="btn-prestige btn-ascend" onclick="triggerAscension()">
        Ascend (+<span id="pendingAstral">0</span>)
      </button>

      <div class="tree-container" id="ascension-tree">
        <!-- Ascension upgrades inject here via JS -->
      </div>
    </div>
    
    <button onclick="restartGame()" class="btn-hard-reset">Hard Reset Game</button>
  </div>

  <!-- RIGHT PANEL: Store (Cookie Clicker Style) -->
  <div class="panel right-panel">
    <h2 class="store-title">Store</h2>
    
    <!-- Upgrades Grid -->
    <div class="upgrades-grid" id="upgrades-container">
        <!-- Upgrades inject here via JS -->
    </div>

    <!-- Buildings List -->
    <div class="buildings-list" id="buildings-container">
        <!-- Buildings inject here via JS -->
    </div>
  </div>
</div>

<script src="script.js?v=8"></script>
</body>
</html>

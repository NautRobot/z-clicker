<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeke Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<!-- Firebase SDK (For Real Player Tracking - see script.js) -->
<script type="module" src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js"></script>

<header class="banner">
  <h1>ZEKE CLICKER</h1>
  <div class="live-stats">
    <div><span class="pulse-dot"></span>Online Now: <span id="realLiveUsers" class="stat-number">1 (You)</span></div>
    <div style="margin-top: 5px;">👁️ Total Visits: <span id="realTotalVisits" class="stat-number">Loading...</span></div>
  </div>
</header>

<!-- Global Tooltip for Upgrades -->
<div id="tooltip" class="tooltip" style="display:none;"></div>

<div class="main-layout">
  
  <!-- LEFT PANEL: The Clicker & Stats -->
  <div class="panel left-panel">
    <div class="score-board">
        <p class="score-main">Zekes: <br><span id="zekeCount" style="color:#00ffff; font-size:2.5rem;">0</span></p>
        <p style="color: #ccc; margin: 10px 0; font-size: 1.1rem;">per second: <span id="cpsDisplay" style="color:#fff;">0</span></p>
    </div>

    <div class="zeke-container">
      <img src="zeke.jpg" id="zeke" alt="Zeke">
    </div>
    
    <div class="stats-box">
      <p>Click Value: <span id="clickValueDisplay">1</span></p>
      <p id="critDisplay" style="display:none; color:#ff00ff; margin-top:5px; font-weight:bold;">✨ Crit Chance: 10% (x5 Damage)</p>
    </div>
  </div>

  <!-- MIDDLE PANEL: Prestige & Skill Trees -->
  <div class="panel middle-panel">
    
    <!-- Rebirth Section -->
    <div class="prestige-section rebirth-section">
      <h3>REBIRTH</h3>
      <p>Soft reset for Memory Fragments.</p>
      <p class="prestige-currency">Memories: <span id="memoryCount">0</span></p>
      <p style="font-size: 0.85rem; color: #aaa;">(+<span id="memoryBoost">0</span>% global production)</p>
      
      <button id="btn-rebirth" class="btn-prestige" onclick="triggerRebirth()">
        Rebirth (+<span id="pendingMemories">0</span>)
      </button>

      <div class="tree-container" id="rebirth-tree">
        <!-- Rebirth upgrades inject here via JS -->
      </div>
    </div>

    <hr style="border-color: #333; margin: 20px 0;">

    <!-- Ascension Section -->
    <div class="prestige-section ascension-section">
      <h3 style="color: #ffd700;">ASCENSION</h3>
      <p>Hard reset for Astral Zekes.</p>
      <p class="prestige-currency" style="color: #ffd700;">Astral Zekes: <span id="astralCount">0</span></p>
      
      <button id="btn-ascend" class="btn-prestige btn-ascend" onclick="triggerAscension()">
        Ascend (+<span id="pendingAstral">0</span>)
      </button>

      <div class="tree-container" id="ascension-tree">
        <!-- Ascension upgrades inject here via JS -->
      </div>
    </div>
    
    <button onclick="restartGame()" class="btn-hard-reset">Hard Reset Game</button>
  </div>

  <!-- RIGHT PANEL: Store (Cookie Clicker Style) -->
  <div class="panel right-panel">
    <h2 class="store-title">Store</h2>
    
    <!-- Upgrades Grid -->
    <div class="upgrades-grid" id="upgrades-container">
        <!-- Upgrades inject here via JS -->
    </div>

    <!-- Buildings List -->
    <div class="buildings-list" id="buildings-container">
        <!-- Buildings inject here via JS -->
    </div>
  </div>
</div>

<script src="script.js?v=7"></script>
</body>
</html>
